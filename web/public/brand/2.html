<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>截图 2 · 国家卫健委卫生发展中心</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f7fb;
        font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
        color: #0f172a;
        padding: 40px;
      }
      .card {
        display: flex;
        align-items: center;
        gap: 36px;
        max-width: 1100px;
        width: 100%;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 24px;
        padding: 48px 56px;
        box-shadow: 0 10px 40px rgba(15, 23, 42, 0.06);
      }
      .logo {
        height: 140px;
        width: auto;
        max-width: 280px;
        object-fit: contain;
        flex-shrink: 0;
        background: #fff;
      }
      .text h1 {
        font-size: 34px;
        line-height: 1.35;
        font-weight: 700;
        letter-spacing: 0.01em;
      }
      .text p {
        margin-top: 12px;
        font-size: 16px;
        color: #64748b;
      }
      @media (max-width: 800px) {
        .card { flex-direction: column; text-align: center; padding: 36px 28px; gap: 24px; }
        .text h1 { font-size: 24px; }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="logo" src="/logo/logo-zhongshan.jpg" alt="国家卫健委卫生发展中心" />
      <div class="text">
        <h1>国家卫健委卫生发展中心<br />智能体平台</h1>
      </div>
    </div>
  </body>
</html>
